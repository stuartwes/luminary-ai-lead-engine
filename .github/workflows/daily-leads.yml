name: Daily Luminary AI leads

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without writing ClickUp tasks"
        type: boolean
        default: true
      max_leads:
        description: "Maximum review-ready leads for this manual run"
        type: number
        default: 2
  schedule:
    # Run at both possible 07:00 UK UTC offsets. The app accepts delayed
    # delivery and ClickUp company-number deduplication prevents duplicate tasks.
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: luminary-daily-leads
      cancel-in-progress: false
    env:
      COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API }}
      CLICKUP_API_TOKEN: ${{ secrets.CLICK_UP_TOKEN }}
      CLICKUP_LIST_ID: ${{ secrets.CLICKUP_LIST_ID }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install .

      - name: Collect and enrich leads
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            luminary-leads --scheduled
          else
            luminary-leads --max-leads "${{ inputs.max_leads }}"
          fi
