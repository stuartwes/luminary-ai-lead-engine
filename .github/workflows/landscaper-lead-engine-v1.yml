name: LuminaryAI – Landscaper Lead Engine – V1

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Research prospects without creating ClickUp tasks"
        type: boolean
        default: true
      max_leads:
        description: "Maximum campaign-ready prospects"
        type: number
        default: 2
      location:
        description: "Optional town/city override; blank uses today's queue location"
        type: string
        required: false
      deep_research:
        description: "Use evidence-checked Deep Research V2 (maximum 10 leads)"
        type: boolean
        default: false
      deep_research_v3:
        description: "Use evidence-checked research plus personalised email composition (maximum 10 leads)"
        type: boolean
        default: false
  schedule:
    # Two UTC triggers keep the run at 08:00 Europe/London across clock changes.
    # The selector permits only the trigger that maps to 08:00 on that date.
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: luminary-landscaper-lead-engine-v1
      cancel-in-progress: false
    env:
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API }}
      OPENAI_API_KEY: ${{ secrets.OPEN_AI_KEY }}
      CLICKUP_API_TOKEN: ${{ secrets.CLICK_UP_TOKEN }}
      LANDSCAPER_LEAD_ENGINE_CLICKUP_LIST_ID: "901220355499"
      DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
      LOCATION_OVERRIDE: ${{ inputs.location }}
      SCHEDULED_CRON: ${{ github.event.schedule }}
      MAX_LEADS: ${{ github.event_name == 'schedule' && 30 || inputs.max_leads }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install .
      - name: Select today's location
        id: location
        run: >-
          luminary-select-landscaper-location
          --manual-location "$LOCATION_OVERRIDE"
          --scheduled-cron "$SCHEDULED_CRON"
          --github-output "$GITHUB_OUTPUT"
      - name: Discover, score and prepare landscaper prospects
        if: steps.location.outputs.should_run == 'true'
        run: >-
          luminary-landscaper-lead-engine
          --location "${{ steps.location.outputs.location }}"
          --max-leads "$MAX_LEADS"
          ${{ inputs.deep_research && '--deep-research' || '' }}
          ${{ inputs.deep_research_v3 && '--deep-research-v3' || '' }}
