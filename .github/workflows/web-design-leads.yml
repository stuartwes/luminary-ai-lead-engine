name: Sevenoaks weak-website pilot

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Audit prospects without creating ClickUp tasks"
        type: boolean
        default: true
      max_leads:
        description: "Maximum review-ready web-design leads"
        type: number
        default: 2
      town:
        description: "Town to search"
        type: string
        default: "Sevenoaks"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: luminary-web-design-pilot
      cancel-in-progress: false
    env:
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API }}
      CLICKUP_API_TOKEN: ${{ secrets.CLICK_UP_TOKEN }}
      WEB_DESIGN_CLICKUP_LIST_ID: "90122029143"
      DRY_RUN: ${{ inputs.dry_run }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install .

      - name: Discover and audit weak websites
        run: >-
          luminary-web-design-leads
          --town "${{ inputs.town }}"
          --max-leads "${{ inputs.max_leads }}"
