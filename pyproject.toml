[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "luminary-ai-lead-engine"
version = "0.1.0"
description = "Compliant UK and Florida new-business lead discovery for Luminary AI Business Lab"
requires-python = ">=3.11"
dependencies = [
  "PyYAML==6.0.2",
  "requests==2.32.4",
  "paramiko==3.5.1",
]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[project.scripts]
luminary-leads = "luminary_leads.cli:main"
luminary-florida-leads = "luminary_leads.florida_cli:main"
luminary-sync-approved = "luminary_leads.sync_cli:main"
luminary-web-design-leads = "luminary_leads.web_design_cli:main"
luminary-configure-weak-site-sequence = "luminary_leads.sequence_cli:main"
luminary-landscaper-lead-engine = "luminary_leads.landscaper_cli:main"
luminary-sync-landscaper-leads = "luminary_leads.landscaper_sync_cli:main"
luminary-configure-landscaper-sequence = "luminary_leads.landscaper_sequence_cli:main"
luminary-select-landscaper-location = "luminary_leads.landscaper_schedule:main"
luminary-schedule-gate = "luminary_leads.schedule_gate:main"

[tool.setuptools.packages.find]
include = ["luminary_leads*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
