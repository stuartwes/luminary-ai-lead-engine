[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "luminary-ai-lead-engine"
version = "0.1.0"
description = "Compliant UK new-business lead discovery for Luminary AI Business Lab"
requires-python = ">=3.11"
dependencies = [
  "PyYAML==6.0.2",
  "requests==2.32.4",
]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[project.scripts]
luminary-leads = "luminary_leads.cli:main"

[tool.setuptools.packages.find]
include = ["luminary_leads*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

