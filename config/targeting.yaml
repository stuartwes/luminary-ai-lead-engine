exclusions:
  sic_codes:
    - "64209" # holding companies
    - "68100" # property buying/selling
    - "68209" # property letting/operating
    - "99999" # dormant
  company_name_terms:
    - holdings
    - property investments
    - residents management
    - right to manage
    - spv

enrichment:
  search_results: 5
  pages_per_site: 4
  # Retry temporary Firecrawl errors (rate limits and HTTP 5xx) with backoff.
  retry_attempts: 3
  retry_backoff_seconds: 2
  allowed_email_prefixes:
    - hello
    - info
    - contact
    - enquiries
    - enquiry
    - office
    - admin
    - team
    - sales
  blocked_email_domains:
    - gmail.com
    - googlemail.com
    - outlook.com
    - hotmail.com
    - live.com
    - yahoo.com
    - icloud.com
    - aol.com
  blocked_website_domains:
    - companieshouse.gov.uk
    - company-information.service.gov.uk
    - linkedin.com
    - facebook.com
    - instagram.com
    - x.com
    - twitter.com
    - endole.co.uk
    - companycheck.co.uk

clickup:
  task_name_prefix: "[REVIEW REQUIRED] AI Lab lead"
  privacy_notice_url: "https://luminaryaibusiness.com/luminaryaibusiness-privacy.html"

instantly:
  campaign_id: "92fb1fbd-92a1-4a07-b500-c4e1d5a38111"
  approved_clickup_status: completed
  skip_if_in_workspace: true
  verify_leads_on_import: false
