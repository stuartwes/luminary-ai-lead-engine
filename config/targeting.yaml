schedule:
  timezone: Europe/London
  local_hour: 7

collection:
  # Each company is considered once, exactly 14 days after incorporation.
  # This limits repeat scraping and creates a predictable daily cohort.
  days_after_incorporation: 14
  max_candidates_per_run: 300
  max_approved_leads_per_run: 50
  company_types: [ltd, llp]
  company_statuses: [active]

# London, South East England, Essex and Hertfordshire. Adjust freely.
location:
  postcode_prefixes:
    - E
    - EC
    - N
    - NW
    - SE
    - SW
    - W
    - WC
    - BR
    - CR
    - DA
    - EN
    - HA
