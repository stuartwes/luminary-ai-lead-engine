  pages_per_site: 4
  retry_attempts: 3
  retry_backoff_seconds: 2
  rate_limit_retry_attempts: 5
  rate_limit_backoff_seconds: 5
  rate_limit_max_wait_seconds: 60
  retry_jitter_seconds: 1
  minimum_request_interval_seconds: 1
  search_country: UK
  search_location: "Sevenoaks,England,United Kingdom"
  scrape_country: GB
  scrape_languages: [en-GB]
  allowed_email_prefixes:
