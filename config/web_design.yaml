target:
  town: Sevenoaks
  parent_location_fallback: London
  industry: landscape_and_garden_design
  query_templates:
    - "gardener in {town}"
    - "landscape gardener in {town}"
    - "garden designer in {town}"
    - "landscaping company in {town}"

collection:
